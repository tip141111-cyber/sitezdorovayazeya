services:
  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/zdorovzeya:ro
      - ./nginx/docker-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    volumes:
      - ../:/var/www/zdorovzeya:ro
      - ./php/docker-www.conf:/usr/local/etc/php-fpm.d/zz-zdorovzeya.conf:ro
