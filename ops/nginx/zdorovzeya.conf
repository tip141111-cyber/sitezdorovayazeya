limit_req_zone $binary_remote_addr zone=site:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lead_form:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_status 429;

server {
    server_name zdorovyezeya.ru www.zdorovyezeya.ru;

    root /var/www/zdorovzeya;
    index index.html;
    server_tokens off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;

    error_page 429 500 502 503 504 /busy.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /busy.html {
        internal;
    }

    location / {
        limit_req zone=site burst=90 nodelay;
        limit_conn addr 20;
        try_files $uri $uri/ =404;
    }

    location = /send.php {
        limit_req zone=lead_form;
        limit_conn addr 5;
        limit_except POST { deny all; }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|webp|css|js|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zdorovyezeya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zdorovyezeya.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name zdorovyezeya.ru www.zdorovyezeya.ru;
    server_tokens off;
    return 301 https://$host$request_uri;
}
