<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Запрос временно ограничен | Центр здоровой семьи</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="https://zdorovyezeya.ru/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --milk: #fbfaf6;
        --moss: #315a4a;
        --ink: #1f2926;
        --muted: #63706b;
        --line: rgba(49, 90, 74, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: var(--milk);
        color: var(--ink);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        line-height: 1.55;
      }

      main {
        width: min(620px, 100%);
        padding: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 22px 70px rgba(31, 41, 38, 0.12);
      }

      img {
        width: 190px;
        height: auto;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 14px;
        color: var(--moss);
        font-size: clamp(34px, 7vw, 52px);
        line-height: 1.02;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 18px;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 13px 20px;
        background: var(--moss);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/logo-variant-1.svg" alt="Центр здоровой семьи" />
      <h1>Слишком много запросов подряд</h1>
      <p>Пожалуйста, попробуйте еще раз через пару минут. Для записи можно позвонить: +7 914 380-74-12.</p>
      <a href="tel:+79143807412">Позвонить</a>
    </main>
  </body>
</html>
